<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>URL Downloader</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c2230; --muted:#6b7385; --line:#e3e6ec; --accent:#2f6fed; --ok:#1a9d5a; --err:#d63c3c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151c; --card:#1b2029; --text:#e8ebf2; --muted:#98a1b5; --line:#2b3240; --accent:#5b8cff; --ok:#3ac07c; --err:#ef6a6a; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,Segoe UI,sans-serif; }
  main { max-width:820px; margin:0 auto; padding:24px 16px 60px; }
  h1 { font-size:22px; margin:0 0 4px; } .sub { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  input[type=text] { flex:1 1 320px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font:inherit; }
  select, button { padding:10px 14px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); font:inherit; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button.small { padding:4px 10px; font-size:13px; }
  .hint { color:var(--muted); font-size:13px; margin-top:8px; } #msg { color:var(--err); margin-top:8px; font-size:13px; }
  h2 { font-size:16px; margin:0 0 10px; }
  .job { padding:10px 0; border-top:1px solid var(--line); } .job:first-of-type { border-top:0; }
  .top { display:flex; justify-content:space-between; gap:8px; align-items:center; }
  .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500; }
  .meta { color:var(--muted); font-size:13px; margin-top:2px; }
  .bar { height:6px; background:var(--line); border-radius:3px; margin-top:6px; overflow:hidden; } .bar > i { display:block; height:100%; background:var(--accent); transition:width .3s; }
  .done .bar > i { background:var(--ok); } .error .meta { color:var(--err); }
  a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
  .empty { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>URL Downloader</h1>
  <p class="sub">Paste a video/audio page, a direct file link, or a magnet / .torrent link.</p>

  <form class="card" id="form">
    <div class="row">
      <input type="text" id="url" placeholder="https://… or magnet:?xt=…" autocomplete="off" required>
      <select id="format" title="Used for video/audio pages">
        <option value="mp4">Video (MP4)</option>
        <option value="mp3">Audio (MP3)</option>
        <option value="m4a">Audio (M4A)</option>
      </select>
      <button class="primary" type="submit">Download</button>
    </div>
    <div class="hint">Only download content you own or have the right to download. Files are saved in the <b>downloads</b> folder.</div>
    <div id="msg"></div>
  </form>

  <section class="card"><h2>Active &amp; recent</h2><div id="jobs" class="empty">Nothing yet.</div></section>
  <section class="card"><h2>Saved files</h2><div id="files" class="empty">No files.</div></section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const jobs = new Map();
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const size = (b) => b > 1073741824 ? (b/1073741824).toFixed(2)+' GB' : b > 1048576 ? (b/1048576).toFixed(1)+' MB' : Math.max(1,Math.round(b/1024))+' KB';

function renderJobs() {
  const list = [...jobs.values()].reverse();
  $('jobs').className = list.length ? '' : 'empty';
  $('jobs').innerHTML = list.length ? list.map((j) => `
    <div class="job ${j.status}">
      <div class="top"><div class="name" title="${esc(j.url)}">${esc(j.name || j.url)}</div>
        ${['done','error','cancelled'].includes(j.status) ? '' : `<button class="small" data-cancel="${j.id}">Cancel</button>`}</div>
      <div class="meta">${esc(j.kind)} · ${esc(j.status)}${j.progress ? ' · ' + j.progress.toFixed(1) + '%' : ''}${j.speed ? ' · ' + esc(j.speed) : ''}${j.eta ? ' · ETA ' + esc(j.eta) : ''}${j.error ? ' · ' + esc(j.error) : ''}
        ${j.status === 'done' && j.file ? ' · <a href="/files/' + encodeURI(j.file) + '" download>Save</a>' : ''}</div>
      <div class="bar"><i style="width:${Math.min(100, j.progress || 0)}%"></i></div>
    </div>`).join('') : 'Nothing yet.';
}

async function loadFiles() {
  const files = await (await fetch('/api/files')).json();
  $('files').className = files.length ? '' : 'empty';
  $('files').innerHTML = files.length ? files.map((f) => `
    <div class="job"><div class="top"><div class="name">${esc(f.name)}</div>
      <div><span class="meta">${size(f.size)}</span> <a href="/files/${encodeURI(f.name)}" download>Download</a>
      <button class="small" data-del="${esc(f.name)}">Delete</button></div></div></div>`).join('') : 'No files.';
}

$('form').addEventListener('submit', async (e) => {
  e.preventDefault(); $('msg').textContent = '';
  const r = await fetch('/api/download', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ url: $('url').value, format: $('format').value }) });
  const data = await r.json();
  if (!r.ok) { $('msg').textContent = data.error; return; }
  jobs.set(data.id, data); renderJobs(); $('url').value = '';
});

document.addEventListener('click', async (e) => {
  const c = e.target.dataset.cancel, d = e.target.dataset.del;
  if (c) await fetch('/api/cancel/' + c, { method: 'POST' });
  if (d && confirm('Delete ' + d + '?')) { await fetch('/api/files?name=' + encodeURIComponent(d), { method: 'DELETE' }); loadFiles(); }
});

fetch('/api/jobs').then((r) => r.json()).then((l) => { l.forEach((j) => jobs.set(j.id, j)); renderJobs(); });
const es = new EventSource('/api/events');
es.onmessage = (m) => {
  const j = JSON.parse(m.data), prev = jobs.get(j.id);
  jobs.set(j.id, j); renderJobs();
  if (j.status === 'done' && prev?.status !== 'done') loadFiles();
};
loadFiles();
</script>
</body>
</html>
